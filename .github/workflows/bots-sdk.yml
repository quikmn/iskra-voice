name: Bot SDK to npm

# Publishes the bot SDK (bots/sdk) to npm as "iskra-bots", with provenance, when a tag bots-sdk-v<version> is pushed.
# The tag's version must match bots/sdk/package.json. No token: npm trusts this workflow in the `npm` environment
# (trusted publishing, OIDC; set up on npmjs.com → iskra-bots → Settings). The tag is made and pushed by
# scripts/release.ps1 -BotSdk after its checks. docs/ci-cd.md → npm.
on:
  push:
    tags: ['bots-sdk-v*']

permissions: {}

concurrency:
  group: bots-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance: npm checks this workflow run's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache: a publishing job shouldn't restore files other runs could have written.
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./bots/sdk/package.json').version")"
          if [ "$TAG" != "bots-sdk-v$version" ]; then
            echo "::error::Tag $TAG doesn't match bots/sdk/package.json version $version (expected bots-sdk-v$version)."
            exit 1
          fi
      - name: Install
        working-directory: bots
        run: npm ci --no-audit --no-fund
      # The SDK bundles the app's client/src/core (handshake, crypto), and the examples and gallery type-check against
      # it, so client's packages (libsodium) must be there too. No install scripts: only the files are needed.
      - name: Install the client's packages
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check the SDK and examples
        working-directory: bots
        run: npm run typecheck
      - name: Build the package
        working-directory: bots
        run: npm run build:sdk
      - name: Check what would be published
        working-directory: bots
        run: npm pack ./sdk --dry-run
      - name: Publish
        working-directory: bots/sdk
        run: npm publish --provenance --access public
