name: Deploy

# Deploys iskra.foo (site/) and app.iskra.foo (client/) and updates the server at chat.iskra.foo, then checks each one.
# Release finalize calls it after publishing a release; run it by hand to redeploy without a release
# (docs/ci-cd-playbook.md). Everything runs in the `release` environment, so its protection rules apply.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy the site and web app from (e.g. v2.0.0-alpha.10 or main)'
        required: true
        default: main
      site:
        description: 'Deploy iskra.foo'
        type: boolean
        default: false
      webapp:
        description: 'Deploy app.iskra.foo'
        type: boolean
        default: false
      server_version:
        description: 'Update chat.iskra.foo to this released version (e.g. 2.0.0-alpha.10); empty = leave it'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      site: { type: boolean, default: false }
      webapp: { type: boolean, default: false }
      server_version: { type: string, default: '' }
    secrets:
      CLOUDFLARE_API_TOKEN: { required: false }
      DROPLET_SSH_KEY: { required: false }

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.136.3

jobs:
  site:
    if: inputs.site
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Expected version
        run: |
          v="$(node -p "require('./desktop/package.json').version")"
          grep -qF "releases/download/v$v/Iskra-Setup-$v.exe" site/index.html || { echo "::error::site/index.html doesn't link to $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # Only the site's own files (every page, the stylesheets, fonts/, .well-known/ (security.txt), worker.js, .assetsignore;
      # never wrangler.toml or .wrangler/),
      # from a folder outside git, so Pages deploys to production as deploy-hero.ps1 did. Pages serves terms.html at /terms.
      - name: Deploy iskra.foo (Pages project iskra-hero-page)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out="$RUNNER_TEMP/site"
          mkdir -p "$out"
          cp site/*.html site/*.css site/*.svg site/*.ico site/*.png site/worker.js site/.assetsignore "$out/"
          cp -r site/fonts site/.well-known "$out/"
          ls -la "$out"
          cd "$out"
          npx --yes "$WRANGLER" pages deploy . --project-name=iskra-hero-page --commit-dirty=true
      - name: Check iskra.foo
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://iskra.foo/?deploy=$GITHUB_RUN_ID-$i" | grep -qF "releases/download/v$VERSION/Iskra-Setup-$VERSION.exe"; then
              echo "iskra.foo links to $VERSION"; exit 0
            fi
            sleep 15
          done
          echo "::error::iskra.foo doesn't link to $VERSION after 5 minutes"; exit 1
      - name: Check the other pages
        run: |
          # Every site/<page>.html must be served at https://iskra.foo/<page> (terms, privacy, support, delete-account, ...).
          # Pages answers unknown paths with index.html and 200, so look for the page's own canonical link.
          pages="$(cd site && ls *.html | sed 's/\.html$//' | grep -vx index)"
          for page in $pages; do
            for i in $(seq 1 8); do
              if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://iskra.foo/$page?deploy=$GITHUB_RUN_ID-$i" | grep -F "<link rel=\"canonical\" href=\"https://iskra.foo/$page\">" >/dev/null; then
                echo "iskra.foo/$page answers"; continue 2
              fi
              sleep 15
            done
            echo "::error::iskra.foo/$page isn't served after 2 minutes"; exit 1
          done
      - name: Check security.txt
        run: |
          # RFC 9116 contact file; its Canonical line names this host.
          for i in $(seq 1 8); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://iskra.foo/.well-known/security.txt?deploy=$GITHUB_RUN_ID-$i" | grep -qxF 'Canonical: https://iskra.foo/.well-known/security.txt'; then
              echo "iskra.foo/.well-known/security.txt answers"; exit 0
            fi
            sleep 15
          done
          echo "::error::iskra.foo/.well-known/security.txt isn't served after 2 minutes"; exit 1

  webapp:
    if: inputs.webapp
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Index asset
        run: |
          asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' client/dist/index.html | head -n1)"
          test -n "$asset" || { echo "::error::no index asset in client/dist/index.html"; exit 1; }
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Deploy app.iskra.foo (Pages project iskra-webclient)
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" pages deploy dist --project-name=iskra-webclient --branch=main --commit-dirty=true
      - name: Check app.iskra.foo
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://app.iskra.foo/?deploy=$GITHUB_RUN_ID-$i" | grep -qF "$ASSET"; then
              curl -fsS -o /dev/null --max-time 20 "https://app.iskra.foo$ASSET"
              echo "app.iskra.foo serves $ASSET"; exit 0
            fi
            sleep 15
          done
          echo "::error::app.iskra.foo doesn't serve $ASSET after 5 minutes"; exit 1
      - name: Check security.txt
        run: |
          for i in $(seq 1 8); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://app.iskra.foo/.well-known/security.txt?deploy=$GITHUB_RUN_ID-$i" | grep -qxF 'Canonical: https://app.iskra.foo/.well-known/security.txt'; then
              echo "app.iskra.foo/.well-known/security.txt answers"; exit 0
            fi
            sleep 15
          done
          echo "::error::app.iskra.foo/.well-known/security.txt isn't served after 2 minutes"; exit 1

  server:
    if: inputs.server_version != ''
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Update chat.iskra.foo
        env:
          VERSION: ${{ inputs.server_version }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DROPLET_KNOWN_HOSTS }}
          HOST: ${{ vars.DROPLET_HOST }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]] || { echo "::error::'$VERSION' isn't a release version"; exit 1; }
          [ -n "$KEY" ] && [ -n "$KNOWN_HOSTS" ] && [ -n "$HOST" ] || { echo "::error::DROPLET_SSH_KEY, DROPLET_KNOWN_HOSTS or DROPLET_HOST isn't set"; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/droplet_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          # The key only runs iskra-update on the server (forced command): the command line is just the version.
          # iskra-update checks the download's checksum, restarts, and rolls back if the server doesn't come up.
          ssh -i "$RUNNER_TEMP/droplet_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=30 "root@$HOST" "$VERSION"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/droplet_key" "$RUNNER_TEMP/known_hosts"
      - name: Check chat.iskra.foo
        env:
          VERSION: ${{ inputs.server_version }}
        run: |
          # Servers with /health (after 2.0.0-alpha.10) must report the new version; older ones just have to answer.
          for i in $(seq 1 12); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' --max-time 20 https://chat.iskra.foo/health || true)"
            if [ "$code" = 200 ] && grep -qF "\"version\":\"$VERSION\"" "$RUNNER_TEMP/health.json"; then echo "chat.iskra.foo runs $VERSION"; exit 0; fi
            if [ "$code" = 404 ] && curl -fsS --max-time 20 https://chat.iskra.foo/ | grep -q '"iskra"'; then echo 'chat.iskra.foo answers'; exit 0; fi
            sleep 10
          done
          echo "::error::chat.iskra.foo doesn't answer as $VERSION after 2 minutes"; cat "$RUNNER_TEMP/health.json" 2>/dev/null; exit 1
