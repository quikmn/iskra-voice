name: Mobile iOS

# Builds the iPhone/iPad app (mobile/: Capacitor around client/dist), signs it for the App Store (Xcode's cloud signing
# with the App Store Connect API key, secrets APPSTORE_*; no certificates or profiles stored here) and keeps the signed
# .ipa as an artifact named for the ref (iskra-ios-<tag>). See mobile/README.md and docs/ci-cd.md "iOS app".
#
# A release: the pushed v* tag (scripts/release.ps1) starts the `build` job here, alongside the Linux and macOS builds;
# release-finalize.yml then uploads that .ipa to TestFlight after publishing (job `testflight`, the shared action
# .github/actions/testflight-upload) and runs scripts/appstore.mjs (.github/actions/appstore-connect). Nothing is
# uploaded from a push run.
# By hand or from scripts/release.ps1 -Phones (workflow_dispatch with upload on): `build`, then `upload` (the same
# action) and `groups` (store mode from mobile/store.json or the `store` input: testflight = Apple's processing, What
# to test, the TestFlight groups and Beta App Review; appstore = that plus the App Store version, listing, screenshots
# and App Review with automatic release; upload = nothing more). With upload off: a test build only.
# It can also be called as a reusable workflow (`secrets: inherit`).
# The run's title names the ref and the upload ("Mobile iOS v2.0.0-alpha.17 (TestFlight)"): release.ps1 -Phones finds
# the run it started (or one a stopped release started) by that title; a push run is just "Mobile iOS v…".
run-name: ${{ format('Mobile iOS {0}{1}', inputs.ref || github.ref_name, inputs.upload && ' (TestFlight)' || '') }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or commit to build (default: the branch the run starts on)'
        required: false
      upload:
        description: 'Upload to TestFlight (off: build, sign and check only)'
        type: boolean
        default: true
      archive_signing:
        description: 'How the archive is signed before cloud signing re-signs it for the App Store'
        type: choice
        options: [adhoc, automatic]
        default: adhoc
      store:
        description: 'After the upload: auto (mobile/store.json), testflight, appstore, or upload (nothing more)'
        type: choice
        options: [auto, testflight, appstore, upload]
        default: auto
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      upload:
        type: boolean
        default: true
      archive_signing:
        type: string
        default: adhoc
      store:
        type: string
        default: auto

permissions:
  contents: read

concurrency:
  group: mobile-ios
  cancel-in-progress: false

env:
  TEAM_ID: BWX2M8XSNZ
  BUNDLE_ID: foo.iskra.app
  # Share to Iskra: the app and its Share Extension (foo.iskra.app.ShareExtension) both have it.
  APP_GROUP: group.foo.iskra.app

jobs:
  # Build, cloud-sign and check (about 5 minutes); the signed .ipa and its version numbers become the artifact
  # iskra-ios-<ref>, which the upload jobs (below, or finalize's) take.
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
      app_version: ${{ steps.version.outputs.app_version }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            mobile/package-lock.json

      # App Store uploads need a current SDK: use the newest released Xcode on the runner, not the default.
      - name: Pick Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|release.?candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # The build number counts this workflow's runs (push and dispatch alike), so it rises with every build.
      - name: Version
        id: version
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          node scripts/mobile-version.mjs "${{ github.run_number }}" "${{ github.run_attempt }}" | tee -a "$GITHUB_ENV" > "$RUNNER_TEMP/version.env"
          {
            echo "app_version=$(sed -n 's/^APP_VERSION=//p' "$RUNNER_TEMP/version.env")"
            echo "marketing_version=$(sed -n 's/^MARKETING_VERSION=//p' "$RUNNER_TEMP/version.env")"
            echo "build_number=$(sed -n 's/^BUILD_NUMBER=//p' "$RUNNER_TEMP/version.env")"
            # The artifact's name: finalize downloads iskra-ios-<tag>. A branch with a slash can't name an artifact.
            echo "artifact=iskra-ios-${REF//\//-}"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm ci
        working-directory: mobile
      - name: Copy the web app into the native project
        run: npx cap sync ios
        working-directory: mobile

      - name: App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::APPSTORE_API_KEY_BASE64, APPSTORE_KEY_ID and APPSTORE_ISSUER_ID must be set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ARCHIVE_SIGNING: ${{ inputs.archive_signing }}
        run: |
          # adhoc (also a push run's choice): sign the archive locally without a certificate (entitlements included), so
          # runs never create development certificates; the export below signs it for the App Store with Apple's cloud
          # certificate. automatic: plain automatic signing (creates an "Apple Development" certificate on each fresh runner).
          signing=()
          if [ "$ARCHIVE_SIGNING" != "automatic" ]; then
            signing=(CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES)
          fi
          xcodebuild archive \
            -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Iskra.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${signing[@]}" > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E 'error:' "$RUNNER_TEMP/archive.log" | head -40; tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E '^\*\* ARCHIVE' "$RUNNER_TEMP/archive.log"

      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/export.plist"

      - name: Sign for the App Store (cloud signing)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Iskra.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      # The checks that matter for TestFlight and Universal Links, before anything is kept or uploaded.
      - name: Check the signed app
        run: |
          cd "$RUNNER_TEMP"
          rm -rf check && mkdir check && unzip -q export/*.ipa -d check
          app="$(ls -d check/Payload/*.app)"
          plist="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist")" = "false"
          test -f "$app/public/index.html"
          codesign --verify --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)='
          codesign -d --entitlements - --xml "$app" > entitlements.plist
          plutil -p entitlements.plist
          grep -q 'applinks:app.iskra.foo' entitlements.plist || { echo "::error::associated-domains entitlement missing"; exit 1; }
          grep -q "$TEAM_ID.$BUNDLE_ID" entitlements.plist
          grep -q "<string>$APP_GROUP</string>" entitlements.plist || { echo "::error::App Groups entitlement missing (Share to Iskra)"; exit 1; }
          # Voice in the background: the audio mode only (no push, no VoIP).
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$plist" | grep -qx '    audio'
          if /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$plist" | grep -qx '    voip'; then echo "::error::voip background mode is back"; exit 1; fi
          if /usr/libexec/PlistBuddy -c 'Print :aps-environment' entitlements.plist >/dev/null 2>&1; then echo "::error::aps-environment is back"; exit 1; fi
          # One extension only: Share to Iskra (mobile/ios/App/ShareExtension), signed by the same team, same versions,
          # with the App Group the app reads shares from.
          test "$(ls "$app/PlugIns" 2>/dev/null)" = "ShareExtension.appex" || { echo "::error::app extensions must be exactly ShareExtension.appex"; ls -la "$app/PlugIns" 2>/dev/null; exit 1; }
          appex="$app/PlugIns/ShareExtension.appex"
          xplist="$appex/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$xplist")" = "$BUNDLE_ID.ShareExtension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$xplist")" = "com.apple.share-services"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$xplist")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$xplist")" = "$BUILD_NUMBER"
          codesign --verify --strict "$appex"
          test "$(codesign -dvv "$appex" 2>&1 | grep '^TeamIdentifier=')" = "TeamIdentifier=$TEAM_ID"
          codesign -d --entitlements - --xml "$appex" > appex-entitlements.plist
          plutil -p appex-entitlements.plist
          grep -q "<string>$APP_GROUP</string>" appex-entitlements.plist || { echo "::error::the share extension lacks the App Group"; exit 1; }
          grep -q "$TEAM_ID.$BUNDLE_ID.ShareExtension" appex-entitlements.plist
          if grep -q 'aps-environment' appex-entitlements.plist; then echo "::error::aps-environment in the share extension"; exit 1; fi
          test ! -d "$appex/PlugIns" || { echo "::error::nested extensions"; exit 1; }
          echo "Iskra $APP_VERSION ($MARKETING_VERSION build $BUILD_NUMBER) is signed for the App Store"

      # The .ipa with its numbers (ios-build.env), for the upload (.github/actions/testflight-upload) and appstore.mjs.
      - name: Keep the signed app
        run: |
          mkdir "$RUNNER_TEMP/app"
          cp "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/app/"
          printf 'APP_VERSION=%s\nMARKETING_VERSION=%s\nBUILD_NUMBER=%s\n' "$APP_VERSION" "$MARKETING_VERSION" "$BUILD_NUMBER" > "$RUNNER_TEMP/app/ios-build.env"
          cat "$RUNNER_TEMP/app/ios-build.env"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ runner.temp }}/app
          if-no-files-found: error
          retention-days: 14

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  # By hand or from release.ps1 -Phones (upload on): the .ipa above to App Store Connect, through the same action
  # finalize uses. Never for a push run (finalize uploads those after the release is published).
  upload:
    needs: build
    if: github.event_name != 'push' && inputs.upload
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      app_version: ${{ steps.upload.outputs.app-version }}
      marketing_version: ${{ steps.upload.outputs.marketing-version }}
      build_number: ${{ steps.upload.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/app
      - id: upload
        uses: ./.github/actions/testflight-upload
        with:
          dir: ${{ runner.temp }}/app
          api-key-base64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          key-id: ${{ secrets.APPSTORE_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}

  # Everything App Store Connect needs after the upload (scripts/appstore.mjs; up to an hour for Apple's processing).
  groups:
    name: TestFlight groups and reviews
    needs: [build, upload]
    if: github.event_name != 'push' && inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/appstore-connect
        with:
          store: ${{ inputs.store || 'auto' }}
          app-version: ${{ needs.build.outputs.app_version }}
          marketing-version: ${{ needs.build.outputs.marketing_version }}
          build-number: ${{ needs.build.outputs.build_number }}
          api-key-base64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          key-id: ${{ secrets.APPSTORE_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          review-phone: ${{ secrets.APPSTORE_REVIEW_PHONE }}
          review-invite-url: ${{ vars.REVIEW_INVITE_URL }}
