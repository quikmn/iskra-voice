name: CI

on:
  # Branches only: a release tag points at a commit main's CI already tested (release-finalize.yml checks that run).
  # Not Dependabot's branches: their pull requests run CI already (no second run per update).
  push:
    branches: ['**', '!dependabot/**']
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']
  # Nightly on main: everything, including what pushes skip (desktop on macOS, the macOS LiveKit cache for releases).
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
  # The Release workflow (release-all.yml) runs CI on its "Version X" commit itself: its own push (GITHUB_TOKEN) can't
  # start this workflow, and finalize's gate then reads that run's "ci / ..." jobs (scripts/ci-gate.mjs --run).
  workflow_call:
    inputs:
      ref:
        description: 'Commit to test (the release commit)'
        type: string
        required: true

permissions:
  contents: read

# A newer push to the same branch (or PR) cancels the older run: only the newest commit's result matters. Never a
# "Version X" commit's run: it gets a group of its own, because release-finalize publishes only after CI passed on
# exactly that commit (scripts/ci-gate.mjs). Tags don't run CI. Scheduled and manual runs are never cancelled, nor is
# the Release workflow's call (its own group, by commit).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version ')) && format('-{0}', github.sha) || '' }}${{ inputs.ref && format('-release-{0}', inputs.ref) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  server:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A stuck test stops here, not at GitHub's six hours. (Test clients already give up on a frame after 5 s; the
    # test platform's --timeout can't stop a test that ignores cancellation, this can.)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release
      # Built the way releases build it (desktop/scripts/prepare-server.mjs): single-file analyzers turn some APIs
      # into errors that a normal build never shows.
      - name: Single-file publish, as the release does
        shell: bash
        run: dotnet publish src/Iskra.Server -c Release -r ${{ matrix.os == 'windows-latest' && 'win-x64' || 'linux-x64' }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o "$RUNNER_TEMP/server-publish"
      # Servers verify release attestations against the Sigstore root compiled into them (Updates/Attestations.cs).
      # When Sigstore adds keys, refresh it before the next release (docs/ci-cd.md); until then this only warns.
      - name: Sigstore trusted root is current
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The whole output first: "| head" would end gh with SIGPIPE (exit 141).
          gh attestation trusted-root > "$RUNNER_TEMP/sigstore-roots.jsonl"
          head -n 1 "$RUNNER_TEMP/sigstore-roots.jsonl" | jq -S . > "$RUNNER_TEMP/sigstore-root.json"
          jq -S . src/Iskra.Server/Updates/sigstore-trusted-root.json | diff -q - "$RUNNER_TEMP/sigstore-root.json" > /dev/null \
            || echo "::warning::server/src/Iskra.Server/Updates/sigstore-trusted-root.json isn't Sigstore's current trusted root: refresh it before the next release (docs/ci-cd.md)"

  client:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # macOS only on PRs, nightly and by hand (pushes keep Windows and Linux); release.yml runs the tests on macOS too.
  desktop:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest", "ubuntu-latest"]' || '["windows-latest", "ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # YouTube and Twitch embeds in real Electron on each OS (offline: no host names resolve).
      - run: node node_modules/electron/install.js
      - run: npm run test:electron
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:electron -- --no-sandbox
        if: runner.os == 'Linux'
      # Chromium makes no background connections of its own (spellcheck dictionaries, Cast discovery, ...).
      - run: npm run test:network
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:network -- --no-sandbox
        if: runner.os == 'Linux'

  # Playwright end-to-end, split over four runners by spec file, balanced by measured duration (scripts/e2e-shards.mjs,
  # client/e2e/durations.json; a new spec counts as the median). Each shard keeps a blob report; the `end-to-end` job
  # below is the one check to require: it fails unless every shard and interop passed, and on a failure merges the
  # shards' blob reports into one HTML report (artifact playwright-report).
  # On CI a failed test runs once more (playwright.config.ts): passing then makes it "flaky", listed in the summary and
  # the #ci message; failing twice stays red. Each shard's JSON report feeds scripts/e2e-flaky.mjs.
  e2e-shard:
    name: end-to-end shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
            bots/package-lock.json
      # The p2p spec runs the desktop app's tunnel on a private testnet; no Electron download.
      - run: npm ci --ignore-scripts
        working-directory: desktop
      # The voice-bots spec runs the Jukebox example bot (bots/: LiveKit's Node SDK and the decoders).
      - run: npm ci
        working-directory: bots
      - run: npm ci
      - name: This shard's specs
        run: node ../scripts/e2e-shards.mjs list ${{ matrix.shard }} 4 "$RUNNER_TEMP/e2e-shard.txt"
      # The split must hold every spec Playwright finds, each once (scripts/e2e-shards.test.mjs checks the same offline).
      - name: Every spec is in exactly one shard
        if: matrix.shard == 1
        run: |
          npx playwright test --list --reporter=json > "$RUNNER_TEMP/e2e-list.json"
          node ../scripts/e2e-shards.mjs check "$RUNNER_TEMP/e2e-list.json" 4
      - run: npx playwright install --with-deps chromium
      # LiveKit (pinned and SHA-256 checked by get-livekit.sh), cached on that script.
      - id: livekit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/livekit-server
          key: livekit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/get-livekit.sh') }}
      - if: steps.livekit.outputs.cache-hit != 'true'
        run: bash ../scripts/get-livekit.sh
      # The live-captions model and the English/Swedish translation models aren't in git: scripts/get-models.mjs
      # fetches them (pinned, SHA-256 checked) into client/.models; cached on the pins in both JSON files.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: client/.models
          key: models-${{ hashFiles('client/src/state/captions/model.json', 'client/src/state/translate/models.json') }}
      - run: node ../scripts/get-models.mjs --translate sv
      - run: npm run test:e2e -- --test-list "$RUNNER_TEMP/e2e-shard.txt" --reporter=list,blob,json
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip # one name per shard, for merge-reports
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-json/report-${{ matrix.shard }}.json
      - name: Flaky and failed tests
        if: ${{ !cancelled() }}
        run: node ../scripts/e2e-flaky.mjs "$RUNNER_TEMP/e2e-json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: client/blob-report
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-json-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: client/test-results

  # The TS client and the bot SDK against the real .NET server (one runner; not sharded).
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
            bots/package-lock.json
      # The p2p interop test runs the desktop app's tunnel on a private testnet; no Electron download.
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm ci
      - id: livekit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/livekit-server
          key: livekit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/get-livekit.sh') }}
      - if: steps.livekit.outputs.cache-hit != 'true'
        run: bash ../scripts/get-livekit.sh
      - run: npm ci && npm run typecheck
        working-directory: bots
      # The p2p interop test checks voice through the tunnel in a real Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:interop

  # The check to require for end-to-end (branch protection): green only when every shard and interop passed.
  end-to-end:
    needs: [e2e-shard, interop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # The tests that only passed on their retry (and those that failed twice), for the summary and the #ci message.
    outputs:
      flaky: ${{ steps.tests.outputs.flaky }}
      failed: ${{ steps.tests.outputs.failed }}
    steps:
      - name: Every shard and interop passed
        id: result
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          INTEROP: ${{ needs.interop.result }}
        run: |
          echo "end-to-end shards: $SHARDS, interop: $INTEROP"
          if [ "$SHARDS" = success ] && [ "$INTEROP" = success ]; then exit 0; fi
          echo "failed=1" >> "$GITHUB_OUTPUT"
          echo "::error::end-to-end shards: $SHARDS, interop: $INTEROP (see the failing job; the merged report is the playwright-report artifact)"
      # Best effort: a summary of every shard's flaky and failed tests; never changes the result.
      - if: needs.e2e-shard.result != 'skipped'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          path: flaky-tool
          sparse-checkout: scripts/e2e-flaky.mjs
          sparse-checkout-cone-mode: false
      - if: needs.e2e-shard.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-json-*
          path: e2e-json
          merge-multiple: true
      - name: Flaky and failed tests
        id: tests
        if: needs.e2e-shard.result != 'skipped'
        continue-on-error: true
        run: node flaky-tool/scripts/e2e-flaky.mjs e2e-json
      # One HTML report from every shard's blob report, the standard Playwright way.
      - if: steps.result.outputs.failed == '1' && needs.e2e-shard.result != 'skipped'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - if: steps.result.outputs.failed == '1' && needs.e2e-shard.result != 'skipped'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Best effort (a shard may have failed before writing a report): the job fails at the end either way.
      - if: steps.result.outputs.failed == '1' && needs.e2e-shard.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: client/all-blob-reports
          merge-multiple: true
      - if: steps.result.outputs.failed == '1' && needs.e2e-shard.result != 'skipped'
        continue-on-error: true
        working-directory: client
        run: |
          npm ci --ignore-scripts
          npx playwright merge-reports --reporter html ./all-blob-reports
      - if: steps.result.outputs.failed == '1' && needs.e2e-shard.result != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14
      - if: steps.result.outputs.failed == '1'
        run: exit 1

  # Two small checks on one runner (fewer jobs per push): the release-script tests (scripts/*.test.mjs, also the e2e
  # shard split), then the backup-restore drill, availability evidence: backs up a server with members, messages and
  # files, restores it into a new folder and checks nothing was lost or changed
  # (server/tests/Iskra.Server.Tests/RestoreDrillTests.cs). The JSON report is kept as an artifact.
  scripts-and-drill:
    name: release scripts and restore drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # scripts/appstore.mjs and play-upload.mjs load jose and google-auth-library from mobile/; build-site-docs.mjs
      # loads markdown-it from the root package.json.
      - name: Release-script dependencies
        run: |
          npm ci --prefix mobile --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund --ignore-scripts
      # actionlint for scripts/workflows.test.mjs (pinned, SHA-256 checked; outside the repo).
      - name: actionlint
        env:
          ACTIONLINT: '1.7.7'
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      # Also the PowerShell release checks (scripts/release-checks.test.mjs, with pwsh from the runner image), the
      # SimplySign TOTP vectors (simplysign.test.mjs), the runner guard and the workflow rules (workflows.test.mjs).
      - name: Release-script tests
        run: npm test
      # Runs even when the script tests failed: two independent results.
      - name: Backup-restore drill
        if: ${{ !cancelled() }}
        working-directory: server
        run: dotnet test --configuration Release --filter-class Iskra.Server.Tests.RestoreDrillTests
        env:
          ISKRA_DRILL_REPORT: ${{ runner.temp }}/restore-drill.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: restore-drill-report
          path: ${{ runner.temp }}/restore-drill.json
          if-no-files-found: error
          retention-days: 90

  # Keeps the macOS LiveKit builds (get-livekit.sh builds them from source, ~3 min) in main's cache, where release tags
  # can read them (a tag's own cache entries aren't visible to the next tag). Only builds when the pin changed. Runs
  # nightly on main (and by hand there) to keep main's entry; on PRs it checks a changed pin still builds on macOS.
  livekit-mac:
    if: github.event_name != 'push'
    continue-on-error: true # a cache warmer: a miss only costs the release ~3 min
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: livekit
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/osx-${{ matrix.arch }}/livekit-server
          key: livekit-osx-${{ matrix.arch }}-${{ hashFiles('scripts/get-livekit.sh') }}
          lookup-only: true
      - if: steps.livekit.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - if: steps.livekit.outputs.cache-hit != 'true'
        run: bash scripts/get-livekit.sh "osx-${{ matrix.arch }}"
      - if: steps.livekit.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/osx-${{ matrix.arch }}/livekit-server
          key: livekit-osx-${{ matrix.arch }}-${{ hashFiles('scripts/get-livekit.sh') }}

  # The Android app (mobile/android): an unsigned release build.
  # Release APKs are signed on the owner's PC (mobile/scripts/build-android.ps1); the key never comes to CI.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            mobile/package-lock.json
      - run: npm ci && npm run build
        working-directory: client
      - run: npm ci && npx cap sync android
        working-directory: mobile
      - name: Gradle
        working-directory: mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew assembleRelease --no-daemon --console=plain

  # Optional: what GitHub's own workflow_run message doesn't say, in an Iskra channel (scripts/ci-notify.mjs; docs/ci-cd.md
  # "CI results in Iskra"): on a failure the failed jobs and end-to-end tests, on a pass the flaky tests; a plain pass
  # posts nothing. Only for main (pushes, nightly, by hand; not the Release workflow's call), only when the secret
  # ISKRA_CI_WEBHOOK is set, and never for a run a newer push cancelled.
  report:
    name: report to Iskra
    needs: [server, client, desktop, end-to-end, scripts-and-drill, android]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the webhook set?
        id: hook
        env:
          ISKRA_CI_WEBHOOK: ${{ secrets.ISKRA_CI_WEBHOOK }}
        run: |
          if [ -n "$ISKRA_CI_WEBHOOK" ]; then echo "set=1" >> "$GITHUB_OUTPUT"; else echo "No ISKRA_CI_WEBHOOK secret: not reporting."; fi
      - if: steps.hook.outputs.set == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts/ci-notify.mjs
          sparse-checkout-cone-mode: false
      - if: steps.hook.outputs.set == '1'
        run: node scripts/ci-notify.mjs ci
        env:
          ISKRA_CI_WEBHOOK: ${{ secrets.ISKRA_CI_WEBHOOK }}
          NEEDS: ${{ toJSON(needs) }}
          E2E_FLAKY: ${{ needs.end-to-end.outputs.flaky }}
          E2E_FAILED: ${{ needs.end-to-end.outputs.failed }}
