name: CI

on:
  push:
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']

permissions:
  contents: read

jobs:
  server:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A stuck test stops here, not at GitHub's six hours. (Test clients already give up on a frame after 5 s; the
    # test platform's --timeout can't stop a test that ignores cancellation, this can.)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release
      # Built the way releases build it (desktop/scripts/prepare-server.mjs): single-file analyzers turn some APIs
      # into errors that a normal build never shows.
      - name: Single-file publish, as the release does
        shell: bash
        run: dotnet publish src/Iskra.Server -c Release -r ${{ matrix.os == 'windows-latest' && 'win-x64' || 'linux-x64' }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o "$RUNNER_TEMP/server-publish"
      # Servers verify release attestations against the Sigstore root compiled into them (Updates/Attestations.cs).
      # When Sigstore adds keys, refresh it before the next release (docs/ci-cd.md); until then this only warns.
      - name: Sigstore trusted root is current
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The whole output first: "| head" would end gh with SIGPIPE (exit 141).
          gh attestation trusted-root > "$RUNNER_TEMP/sigstore-roots.jsonl"
          head -n 1 "$RUNNER_TEMP/sigstore-roots.jsonl" | jq -S . > "$RUNNER_TEMP/sigstore-root.json"
          jq -S . src/Iskra.Server/Updates/sigstore-trusted-root.json | diff -q - "$RUNNER_TEMP/sigstore-root.json" > /dev/null \
            || echo "::warning::server/src/Iskra.Server/Updates/sigstore-trusted-root.json isn't Sigstore's current trusted root: refresh it before the next release (docs/ci-cd.md)"

  client:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The interop tests type-check against the desktop app's p2p tunnel (desktop/src/p2p); no Electron download.
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # YouTube and Twitch embeds in real Electron on each OS (offline: no host names resolve).
      - run: node node_modules/electron/install.js
      - run: npm run test:electron
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:electron -- --no-sandbox
        if: runner.os == 'Linux'
      # Chromium makes no background connections of its own (spellcheck dictionaries, Cast discovery, ...).
      - run: npm run test:network
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:network -- --no-sandbox
        if: runner.os == 'Linux'

  end-to-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The p2p interop test runs the desktop app's tunnel on a private testnet; no Electron download.
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash ../scripts/get-livekit.sh
      # The live-captions model isn't in git: scripts/get-models.mjs fetches it (pinned, SHA-256 checked) into
      # client/.models; cached on the pins in model.json.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: client/.models
          key: captions-model-${{ hashFiles('client/src/state/captions/model.json') }}
      - run: node ../scripts/get-models.mjs
      - run: npm ci && npm run typecheck
        working-directory: bots
      - run: npm run test:interop
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: client/test-results

  # Availability evidence: backs up a server with members, messages and files, restores it into a new folder and checks
  # nothing was lost or changed (server/tests/Iskra.Server.Tests/RestoreDrillTests.cs). The JSON report is kept as an artifact.
  backup-restore-drill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release --filter-class Iskra.Server.Tests.RestoreDrillTests
        env:
          ISKRA_DRILL_REPORT: ${{ runner.temp }}/restore-drill.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: restore-drill-report
          path: ${{ runner.temp }}/restore-drill.json
          if-no-files-found: error
          retention-days: 90

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm test

  # The Android app (mobile/android): an unsigned release build.
  # Release APKs are signed on the owner's PC (mobile/scripts/build-android.ps1); the key never comes to CI.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            mobile/package-lock.json
      - run: npm ci && npm run build
        working-directory: client
      - run: npm ci && npx cap sync android
        working-directory: mobile
      - name: Gradle
        working-directory: mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew assembleRelease --no-daemon --console=plain
