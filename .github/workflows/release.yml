name: Release builds (Linux, macOS)

# Builds the Linux and macOS desktop apps (and server bundles) for a tag and attaches them to its GitHub release.
# Windows builds are signed through SimplySign on the home PC (release-windows.ps1).
# If the release doesn't exist yet it's created as a draft prerelease; an existing release keeps its state.
# Started by a pushed v* tag (scripts/release.ps1), or called by the Release workflow (release-all.yml), whose own tag
# push can't start it.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      ref: { type: string, default: '' }
      # The Release workflow refuses an ad-hoc signed Mac build (installed Mac apps couldn't update to it).
      require_mac_signing: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v2.0.0-alpha.3'
        required: true
      ref:
        description: 'Commit or branch to build from (defaults to the tag; for rebuilding a release after a build fix)'
        required: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - name: Check the tag matches the app version
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$TAG"
      - run: sudo apt-get update && sudo apt-get install -y rpm libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev # uiohook-napi builds from source on Linux
      # LiveKit (pinned and SHA-256 checked by get-livekit.sh), from the cache CI keeps on main (prepare-server.mjs
      # takes .tools/livekit-server for the runner's own platform).
      - id: livekit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/livekit-server
          key: livekit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/get-livekit.sh') }}
      - if: steps.livekit.outputs.cache-hit != 'true'
        run: bash scripts/get-livekit.sh
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist:linux
        working-directory: desktop
      # The standalone server's peer-to-peer tunnel (one Node single executable; the desktop app runs its own).
      - run: node scripts/build-sidecar.mjs linux-x64
        working-directory: desktop
      - name: Server bundle
        run: |
          v="${TAG#v}"
          # The guard undoes an automatic update that doesn't start (systemd ExecStartPre, docs/hosting.md).
          install -m 755 server/deploy/iskra-update-guard desktop/build/server-linux-x64/iskra-update-guard
          tar -czf "desktop/release/iskra-server-$v-linux-x64.tar.gz" -C desktop/build/server-linux-x64 . -C "$PWD/desktop/build/p2p-linux-x64" iskra-p2p iskra-p2p-licenses.txt
          tar -tzf "desktop/release/iskra-server-$v-linux-x64.tar.gz" | grep -x iskra-p2p > /dev/null || { echo "::error::the server bundle has no iskra-p2p"; exit 1; }
      # The standalone server for 64-bit ARM Linux (Raspberry Pi 4/5 and other small boxes): cross-published here,
      # with LiveKit's official linux-arm64 build (pinned and checked by get-livekit.sh).
      - name: Server bundle (linux-arm64)
        run: |
          v="${TAG#v}"
          bash scripts/get-livekit.sh linux-arm64
          node desktop/scripts/prepare-server.mjs linux-arm64
          install -m 755 server/deploy/iskra-update-guard desktop/build/server-linux-arm64/iskra-update-guard
          tar -czf "desktop/release/iskra-server-$v-linux-arm64.tar.gz" -C desktop/build/server-linux-arm64 .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/latest-linux.yml
            desktop/release/iskra-server-*.tar.gz

  # One job per architecture, side by side: each builds, signs and notarizes its own dmg and zip. Their latest-mac.yml
  # files (one architecture each) are merged in `publish` into the one a two-architecture build writes.
  mac:
    name: mac (${{ matrix.arch }})
    runs-on: macos-latest # Apple silicon; cross-builds x64
    strategy:
      fail-fast: false # a rerun of failed jobs then rebuilds only the broken architecture
      matrix:
        arch: [arm64, x64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - name: Check the tag matches the app version
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$TAG"
      # LiveKit has no official macOS builds: get-livekit.sh builds the pinned release from source. Cached on that
      # script (it holds the pinned version and commit); CI's livekit-mac job keeps the entry on main, where tags read it.
      - id: livekit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/osx-${{ matrix.arch }}/livekit-server
          key: livekit-osx-${{ matrix.arch }}-${{ hashFiles('scripts/get-livekit.sh') }}
      - if: steps.livekit.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - if: steps.livekit.outputs.cache-hit != 'true'
        run: bash scripts/get-livekit.sh "osx-$ARCH"
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: desktop
      - run: npm test
        if: matrix.arch == 'arm64'
        working-directory: desktop
      # Signed with the Developer ID and notarized by Apple when the secrets are set; otherwise ad-hoc signed as before.
      - name: Apple signing and notarization keys
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          IDENTITY: ${{ vars.MAC_IDENTITY }}
          REQUIRE_SIGNING: ${{ inputs.require_mac_signing || false }}
        run: |
          if [ -n "$CERT" ] && [ -n "$API_KEY" ] && [ -n "$IDENTITY" ]; then
            echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            # Our own keychain: electron-builder's temporary one fails to unlock on current macOS runners.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$keychain"
            echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
            echo "MAC_SIGNED=1" >> "$GITHUB_ENV"
          elif [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::MAC_CERT_P12_BASE64, APPSTORE_API_KEY_BASE64 or MAC_IDENTITY isn't set: the Release workflow doesn't ship ad-hoc signed Mac builds (docs/ci-cd.md, Apple)"
            exit 1
          else
            echo "No Apple Developer ID secrets: building ad-hoc signed (not notarized)."
          fi
      - name: Desktop app (signed and notarized)
        if: env.MAC_SIGNED == '1'
        run: npm run "dist:mac-$ARCH" -- "-c.mac.identity=$MAC_IDENTITY" -c.mac.hardenedRuntime=true -c.mac.notarize=true
        working-directory: desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          MAC_IDENTITY: ${{ vars.MAC_IDENTITY }}
      - name: Desktop app (ad-hoc signed)
        if: env.MAC_SIGNED != '1'
        run: |
          echo "::warning::Ad-hoc signed Mac build: installed Mac apps can't update to it by themselves (they show a download link)."
          npm run "dist:mac-$ARCH"
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The Mac app updates itself from these zips (Squirrel.Mac): each must hold a Developer ID signed, notarized app,
      # and latest-mac.yml must list both (publish merges and checks the two jobs' files), or installed apps fall back
      # to a download link.
      - name: Check the update files
        if: env.MAC_SIGNED == '1'
        working-directory: desktop/release
        run: |
          v="${TAG#v}"
          team="$(echo "$MAC_IDENTITY" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')"
          zip="Iskra-$v-mac-$ARCH.zip"
          grep -q "url: $zip" latest-mac.yml || { echo "::error::latest-mac.yml doesn't list $zip"; exit 1; }
          test -f "$zip.blockmap" || { echo "::error::$zip.blockmap is missing"; exit 1; }
          dir="$RUNNER_TEMP/check-$ARCH"
          rm -rf "$dir" && mkdir -p "$dir" && ditto -x -k "$zip" "$dir"
          codesign --verify --deep --strict "$dir/Iskra.app"
          codesign -dv --verbose=2 "$dir/Iskra.app" 2>&1 | grep -E '^(Authority=Developer ID Application|TeamIdentifier)'
          codesign -dv "$dir/Iskra.app" 2>&1 | grep -qx "TeamIdentifier=$team" || { echo "::error::$zip isn't signed by team $team"; exit 1; }
          xcrun stapler validate "$dir/Iskra.app" || echo "::warning::$zip: no stapled notarization ticket (Gatekeeper checks online instead)"
          spctl --assess --type execute -vv "$dir/Iskra.app"
        env:
          MAC_IDENTITY: ${{ vars.MAC_IDENTITY }}
      # The standalone server's peer-to-peer tunnel, ad-hoc signed like the server binaries (x64: Node for x64 from
      # nodejs.org, checked against SHASUMS256.txt).
      - run: node scripts/build-sidecar.mjs "osx-$ARCH"
        working-directory: desktop
      - name: Server bundle
        run: |
          v="${TAG#v}"
          tar -czf "desktop/release/iskra-server-$v-osx-$ARCH.tar.gz" -C "desktop/build/server-mac-$ARCH" . -C "$PWD/desktop/build/p2p-mac-$ARCH" iskra-p2p iskra-p2p-licenses.txt
          tar -tzf "desktop/release/iskra-server-$v-osx-$ARCH.tar.gz" | grep -x iskra-p2p > /dev/null || { echo "::error::the server bundle has no iskra-p2p"; exit 1; }
      # This job's latest-mac.yml lists only its own architecture: renamed so publish can merge the two.
      - name: Update file part
        run: |
          v="${TAG#v}"
          grep -qx "version: $v" desktop/release/latest-mac.yml || { echo "::error::latest-mac.yml isn't for $v"; exit 1; }
          mv desktop/release/latest-mac.yml "desktop/release/latest-mac-$ARCH.part.yml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac-*.part.yml
            desktop/release/iskra-server-*.tar.gz

  publish:
    needs: [linux, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          path: src
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # One latest-mac.yml listing both architectures, checked against the zips and dmgs (sha512, size); the parts go.
      - name: Merge latest-mac.yml
        run: node src/scripts/release-assets.mjs merge-yml "${TAG#v}" assets latest-mac.yml latest-mac-x64.part.yml latest-mac-arm64.part.yml
      # Provenance for the Linux and macOS files: gh attestation verify <file> -R quikmn/iskra-voice
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --verify-tag --title "Iskra ${TAG#v}" --notes "Linux and macOS builds are attached; Windows builds follow."
          fi
          gh release upload "$TAG" assets/* --clobber
