name: Release

# Builds the Linux and macOS desktop apps (and server bundles) for a tag and attaches them to its GitHub release.
# Windows builds stay local because they're signed with a hardware-token certificate.
# If the release doesn't exist yet it's created as a draft prerelease; an existing release keeps its state.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v2.0.0-alpha.3'
        required: true
      ref:
        description: 'Commit or branch to build from (defaults to the tag; for rebuilding a release after a build fix)'
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REF: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - name: Check the tag matches the app version
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$TAG"
      - run: sudo apt-get update && sudo apt-get install -y rpm libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev # uiohook-napi builds from source on Linux
      - run: bash scripts/get-livekit.sh linux-x64
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist:linux
        working-directory: desktop
      - name: Server bundle
        run: |
          v="${TAG#v}"
          tar -czf "desktop/release/iskra-server-$v-linux-x64.tar.gz" -C desktop/build/server-linux-x64 .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/latest-linux.yml
            desktop/release/iskra-server-*.tar.gz

  mac:
    runs-on: macos-latest # Apple silicon; builds both architectures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - name: Check the tag matches the app version
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$TAG"
      # LiveKit has no official macOS builds: build the pinned release from source.
      - run: bash scripts/get-livekit.sh osx-arm64 && bash scripts/get-livekit.sh osx-x64
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      # Signed with the Developer ID and notarized by Apple when the secrets are set; otherwise ad-hoc signed as before.
      - name: Apple signing and notarization keys
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          IDENTITY: ${{ vars.MAC_IDENTITY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$API_KEY" ] && [ -n "$IDENTITY" ]; then
            echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            # Our own keychain: electron-builder's temporary one fails to unlock on current macOS runners.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$keychain"
            echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
            echo "MAC_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No Apple Developer ID secrets: building ad-hoc signed (not notarized)."
          fi
      - name: Desktop app (signed and notarized)
        if: env.MAC_SIGNED == '1'
        run: npm run dist:mac -- "-c.mac.identity=$MAC_IDENTITY" -c.mac.hardenedRuntime=true -c.mac.notarize=true
        working-directory: desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          MAC_IDENTITY: ${{ vars.MAC_IDENTITY }}
      - name: Desktop app (ad-hoc signed)
        if: env.MAC_SIGNED != '1'
        run: npm run dist:mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Server bundles
        run: |
          v="${TAG#v}"
          for arch in arm64 x64; do
            tar -czf "desktop/release/iskra-server-$v-osx-$arch.tar.gz" -C "desktop/build/server-mac-$arch" .
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
            desktop/release/iskra-server-*.tar.gz

  publish:
    needs: [linux, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      # Provenance for the Linux and macOS files: gh attestation verify <file> -R quikmn/iskra-voice
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --verify-tag --title "Iskra ${TAG#v}" --notes "Linux and macOS builds are attached; Windows builds follow."
          fi
          gh release upload "$TAG" assets/* --clobber
