name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, branch protection, code review,
# token permissions, ...) and uploads the findings to code scanning (Security tab). With publish_results the score is
# public at https://scorecard.dev/viewer/?uri=github.com/quikmn/iskra-voice. Scorecard only allows a few actions in
# this job, and no top-level env or defaults. Weekly on main (that run publishes), on PRs (no publishing: only the
# default branch can) and by hand; not on every push.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: signs the results for the public API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
