name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, branch protection, code review,
# token permissions, ...) and uploads the findings to code scanning (Security tab). With publish_results the score is
# public at https://scorecard.dev/viewer/?uri=github.com/quikmn/iskra-voice. Scorecard only allows a few actions in
# this job, and no top-level env or defaults. Weekly on main (that run publishes), on PRs (no publishing: only the
# default branch can) and by hand; not on every push.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: signs the results for the public API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
