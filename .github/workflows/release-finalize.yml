name: Release finalize

# Last step of a release (docs/ci-cd.md), started by scripts/release.ps1 once every build is attached:
# checks the release files, adds CycloneDX SBOMs, SHA256SUMS.txt and build-provenance attestations, publishes the release as
# Latest with docs/releases/<version>.md as notes, then deploys iskra.foo and app.iskra.foo and updates chat.iskra.foo.
# Runs in the `release` environment, which has no required reviewers: nothing waits for a click.
# Release builds start on the tag without waiting for CI, so this is the automatic gate: nothing is uploaded or published until the
# CI workflow concluded success on the tagged commit (scripts/ci-gate.mjs; waits up to CI_WAIT_MINUTES, then fails).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2.0.0-alpha.10'
        required: true
      deploy:
        description: 'Deploy the site and web app and update chat.iskra.foo after publishing'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-finalize-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # upload SHA256SUMS.txt, publish the release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
      actions: read # the CI runs of the tagged commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_WAIT_MINUTES: '45'
    timeout-minutes: 90
    steps:
      - name: Check the tag
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]] || { echo "::error::'$TAG' isn't a release tag (vX.Y.Z or vX.Y.Z-alpha.N)"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Before anything changes on the release: a push run of ci.yml must have concluded success on exactly this commit.
      - name: CI passed on the tagged commit
        run: node scripts/ci-gate.mjs "$(git rev-parse HEAD)" --repo "$GH_REPO" --wait-minutes "$CI_WAIT_MINUTES"
      - name: Check the version and release notes
        run: |
          test "$(node -p "require('./desktop/package.json').version")" = "$VERSION" || { echo "::error::desktop/package.json at $TAG isn't $VERSION"; exit 1; }
          test -s "docs/releases/$VERSION.md" || { echo "::error::docs/releases/$VERSION.md is missing at $TAG"; exit 1; }
          gh release view "$TAG" --json isDraft,name --jq '"Release \(.name) (draft: \(.isDraft))"'
      - name: Download the release files
        run: |
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          rm -f "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          ls -l "$RUNNER_TEMP/assets"
      - name: Check every expected file is there and the update files match
        run: node scripts/release-assets.mjs check "$VERSION" "$RUNNER_TEMP/assets"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      # CycloneDX SBOMs of what ships: the web app's and desktop app's runtime npm packages (from the lock files)
      # and the server's NuGet packages. Added before SHA256SUMS.txt, so the sums and attestations cover them too.
      - name: SBOMs (CycloneDX)
        env:
          CYCLONEDX_NPM: '@cyclonedx/cyclonedx-npm@6.0.1'
          CYCLONEDX_DOTNET: '6.2.1'
        run: |
          out="$RUNNER_TEMP/assets"
          for app in client desktop; do
            (cd "$app" && npx --yes "$CYCLONEDX_NPM" --package-lock-only --omit dev --spec-version 1.6 --output-format JSON \
              --mc-type application --output-reproducible --output-file "$RUNNER_TEMP/sbom-$app.json")
          done
          dotnet tool install CycloneDX --version "$CYCLONEDX_DOTNET" --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/dotnet-CycloneDX" server/src/Iskra.Server/Iskra.Server.csproj -o "$RUNNER_TEMP" -fn sbom-server.json \
            -F Json -spv 1.6 -ed -sn iskra-server -sv "$VERSION"
          # One name and version per file, whatever package.json says (the web app's is 0.0.0).
          jq --arg v "$VERSION" '.metadata.component.name = "iskra-web" | .metadata.component.version = $v' "$RUNNER_TEMP/sbom-client.json" > "$out/iskra-sbom-web-$VERSION.cdx.json"
          jq --arg v "$VERSION" '.metadata.component.name = "iskra-desktop" | .metadata.component.version = $v' "$RUNNER_TEMP/sbom-desktop.json" > "$out/iskra-sbom-desktop-$VERSION.cdx.json"
          jq --arg v "$VERSION" '.metadata.component.version = $v' "$RUNNER_TEMP/sbom-server.json" > "$out/iskra-sbom-server-$VERSION.cdx.json"
          for f in "$out"/iskra-sbom-*-"$VERSION".cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$f" > /dev/null || { echo "::error::$f isn't a usable SBOM"; exit 1; }
            echo "$(basename "$f"): $(jq '.components | length' "$f") components"
          done
          gh release upload "$TAG" "$out"/iskra-sbom-*-"$VERSION".cdx.json --clobber
      - name: SHA256SUMS.txt
        run: node scripts/release-assets.mjs sums "$RUNNER_TEMP/assets"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt
        run: gh release upload "$TAG" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --clobber
      - name: Publish
        run: |
          title="$(node --input-type=module -e "import { releaseTitle } from './scripts/release-lib.mjs'; console.log(releaseTitle(process.argv[1]))" "$VERSION")"
          gh release edit "$TAG" --draft=false --prerelease=false --latest --title "$title" --notes-file "docs/releases/$VERSION.md"
          echo "Published $title: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the downloads
        run: |
          for f in "Iskra-Setup-$VERSION.exe" "Iskra-$VERSION-mac-arm64.dmg" "Iskra-$VERSION-x86_64.AppImage" SHA256SUMS.txt; do
            curl -fsSIL -o /dev/null --max-time 30 "https://github.com/$GH_REPO/releases/download/$TAG/$f" || { echo "::error::$f doesn't download"; exit 1; }
          done
          latest="$(gh release view --json tagName --jq .tagName)"
          test "$latest" = "$TAG" || { echo "::error::GitHub's latest release is $latest, not $TAG"; exit 1; }

  deploy:
    needs: publish
    if: inputs.deploy
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      site: true
      webapp: true
      server_version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  # Optional: the outcome in an Iskra channel (scripts/ci-notify.mjs; docs/ci-cd.md "CI results in Iskra"), only when the
  # secret ISKRA_CI_WEBHOOK is set. Sends the tag, short commit, published/failed and the run link; nothing else.
  report:
    name: report to Iskra
    needs: [publish, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Is the webhook set?
        id: hook
        env:
          ISKRA_CI_WEBHOOK: ${{ secrets.ISKRA_CI_WEBHOOK }}
        run: |
          if [ -n "$ISKRA_CI_WEBHOOK" ]; then echo "set=1" >> "$GITHUB_OUTPUT"; else echo "No ISKRA_CI_WEBHOOK secret: not reporting."; fi
      - if: steps.hook.outputs.set == '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-notify.mjs
          sparse-checkout-cone-mode: false
      - if: steps.hook.outputs.set == '1'
        run: node scripts/ci-notify.mjs release
        env:
          ISKRA_CI_WEBHOOK: ${{ secrets.ISKRA_CI_WEBHOOK }}
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.publish.outputs.commit }}
