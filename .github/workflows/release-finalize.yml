name: Release finalize

# Last step of a release (docs/ci-cd.md), started by scripts/release.ps1 once every build is attached:
# checks the release files (the builds, release.yml's SBOMs, the update files), adds SHA256SUMS.txt and
# build-provenance attestations, publishes the release as Latest with docs/releases/<version>.md as notes, then, side by
# side: deploys iskra.foo and app.iskra.foo and updates chat.iskra.foo (deploy.yml), and uploads the iPhone app the tag
# push built (mobile-ios.yml) to TestFlight; after that upload, scripts/appstore.mjs (TestFlight groups and reviews).
# Runs in the `release` environment, which has no required reviewers: nothing waits for a click.
# Release builds start on the tag without waiting for CI, so this is the automatic gate: nothing is uploaded or published until the
# CI workflow concluded success on the tagged commit (scripts/ci-gate.mjs; waits up to CI_WAIT_MINUTES, then fails).
# The Release workflow (release-all.yml) calls it too, after running CI on the tagged commit in its own run: then the
# gate checks that run's CI jobs (ci_run; scripts/ci-gate.mjs --run). A manual run can't set ci_run.
run-name: Release finalize ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2.0.0-alpha.10'
        required: true
      deploy:
        description: 'Deploy the site and web app and update chat.iskra.foo after publishing'
        type: boolean
        default: true
      testflight:
        description: 'Upload the iPhone app the tag push built (mobile-ios.yml) to TestFlight after publishing'
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      deploy: { type: boolean, default: true }
      testflight: { type: boolean, default: true }
      # The calling Release run's id: its "ci / ..." jobs tested the tagged commit.
      ci_run: { type: string, default: '' }

permissions: {}

concurrency:
  group: release-finalize-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # upload SHA256SUMS.txt, publish the release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
      actions: read # the CI runs of the tagged commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_WAIT_MINUTES: '45'
    timeout-minutes: 90
    steps:
      - name: Check the tag
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]] || { echo "::error::'$TAG' isn't a release tag (vX.Y.Z or vX.Y.Z-alpha.N)"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Before anything changes on the release: a push run of ci.yml must have concluded success on exactly this commit
      # (or, called by the Release workflow, the CI it ran on this commit in the same run).
      - name: CI passed on the tagged commit
        env:
          CI_RUN: ${{ inputs.ci_run }}
        run: |
          if [ -n "$CI_RUN" ]; then
            test "$CI_RUN" = "$GITHUB_RUN_ID" || { echo "::error::ci_run $CI_RUN isn't this run ($GITHUB_RUN_ID)"; exit 1; }
            node scripts/ci-gate.mjs "$(git rev-parse HEAD)" --run "$CI_RUN" --repo "$GH_REPO" --wait-minutes 5
          else
            node scripts/ci-gate.mjs "$(git rev-parse HEAD)" --repo "$GH_REPO" --wait-minutes "$CI_WAIT_MINUTES"
          fi
      - name: Check the version and release notes
        run: |
          test "$(node -p "require('./desktop/package.json').version")" = "$VERSION" || { echo "::error::desktop/package.json at $TAG isn't $VERSION"; exit 1; }
          test -s "docs/releases/$VERSION.md" || { echo "::error::docs/releases/$VERSION.md is missing at $TAG"; exit 1; }
          gh release view "$TAG" --json isDraft,name --jq '"Release \(.name) (draft: \(.isDraft))"'
      - name: Download the release files
        run: |
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          rm -f "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          ls -l "$RUNNER_TEMP/assets"
      # Every file in scripts/release-assets.json: the builds, the CycloneDX SBOMs release.yml's sbom job made from the
      # tag's lock files and project (missing: rerun that job), and the update files, which must match the files.
      - name: Check every expected file is there and the update files match
        run: node scripts/release-assets.mjs check "$VERSION" "$RUNNER_TEMP/assets"
      - name: SHA256SUMS.txt
        run: node scripts/release-assets.mjs sums "$RUNNER_TEMP/assets"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt
        run: gh release upload "$TAG" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --clobber
      - name: Publish
        run: |
          title="$(node --input-type=module -e "import { releaseTitle } from './scripts/release-lib.mjs'; console.log(releaseTitle(process.argv[1]))" "$VERSION")"
          gh release edit "$TAG" --draft=false --prerelease=false --latest --title "$title" --notes-file "docs/releases/$VERSION.md"
          echo "Published $title: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the downloads
        run: |
          for f in "Iskra-Setup-$VERSION.exe" "Iskra-$VERSION-mac-arm64.dmg" "Iskra-$VERSION-x86_64.AppImage" SHA256SUMS.txt; do
            curl -fsSIL -o /dev/null --max-time 30 "https://github.com/$GH_REPO/releases/download/$TAG/$f" || { echo "::error::$f doesn't download"; exit 1; }
          done
          latest="$(gh release view --json tagName --jq .tagName)"
          test "$latest" = "$TAG" || { echo "::error::GitHub's latest release is $latest, not $TAG"; exit 1; }

  deploy:
    needs: publish
    if: inputs.deploy
    permissions:
      contents: read
      actions: read # the webapp job reuses the web app release.yml built for the tag (its artifact)
    uses: ./.github/workflows/deploy.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      site: true
      webapp: true
      server_version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  # The iPhone app: the tag push started a Mobile iOS run (mobile-ios.yml) beside the release builds; its signed .ipa
  # (artifact iskra-ios-<tag>) goes to App Store Connect here, after the release is published and beside the deploys.
  # Nothing else in this workflow depends on it. No build run, or a failed one: this job fails with the fallback
  # (scripts/release.ps1 -Phones builds and uploads the old way); the release stays published and deployed.
  testflight:
    name: TestFlight upload
    needs: publish
    if: inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the Mobile iOS run of the tag and its artifact
    outputs:
      app_version: ${{ steps.upload.outputs.app-version }}
      marketing_version: ${{ steps.upload.outputs.marketing-version }}
      build_number: ${{ steps.upload.outputs.build-number }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FALLBACK: 'the release is published; scripts/release.ps1 -Phones builds the iPhone app again and uploads it (docs/ci-cd-playbook.md, I)'
    steps:
      - name: The Mobile iOS build of the tag
        id: build
        run: |
          id="$(gh run list --workflow mobile-ios.yml --branch "$TAG" --event push -L 5 --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId // empty')"
          [ -n "$id" ] || { echo "::error::no Mobile iOS build run for $TAG (the tag push starts one): $FALLBACK"; exit 1; }
          url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          echo "Mobile iOS build: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # It started with the release builds, so it is normally long done; a queued macOS runner gets 25 minutes.
          status=''
          for i in $(seq 1 100); do
            read -r status conclusion < <(gh run view "$id" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            [ "$status" = completed ] && break
            sleep 15
          done
          [ "$status" = completed ] || { echo "::error::the Mobile iOS build $url hasn't finished after 25 minutes: re-run this job when it has, or $FALLBACK"; exit 1; }
          [ "$conclusion" = success ] || { echo "::error::the Mobile iOS build $url concluded $conclusion (gh run view $id --log-failed; the playbook's mobile-ios.yml rows): $FALLBACK"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Its signed app
        env:
          RUN: ${{ steps.build.outputs.id }}
        run: |
          gh run download "$RUN" --name "iskra-ios-$TAG" --dir "$RUNNER_TEMP/app" || { echo "::error::run $RUN has no artifact iskra-ios-$TAG (expired after 14 days?): $FALLBACK"; exit 1; }
          ls -l "$RUNNER_TEMP/app"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: upload
        uses: ./.github/actions/testflight-upload
        with:
          dir: ${{ runner.temp }}/app
          api-key-base64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          key-id: ${{ secrets.APPSTORE_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}

  # Everything App Store Connect needs after the upload (scripts/appstore.mjs): Apple's processing (up to an hour),
  # What to test, the TestFlight groups, Beta App Review; phase B the App Store version. Its own job, so release.ps1 can
  # end once the upload is done; a failure here still reaches the Iskra channel (the workflow_run webhook).
  testflight-groups:
    name: TestFlight groups and reviews
    needs: testflight
    if: inputs.testflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/appstore-connect
        with:
          store: auto
          app-version: ${{ needs.testflight.outputs.app_version }}
          marketing-version: ${{ needs.testflight.outputs.marketing_version }}
          build-number: ${{ needs.testflight.outputs.build_number }}
          api-key-base64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          key-id: ${{ secrets.APPSTORE_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          review-phone: ${{ secrets.APPSTORE_REVIEW_PHONE }}
          review-invite-url: ${{ vars.REVIEW_INVITE_URL }}
