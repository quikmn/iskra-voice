name: Secrets scan

# Scans the whole git history (every branch and tag) for committed secrets with gitleaks. A pinned release binary,
# checked against its SHA-256 below, so nothing unpinned runs. Rules: .gitleaks.toml (defaults + test vectors);
# reviewed historic findings: .gitleaksignore. A finding fails the job: revoke the secret first, then remove it.
on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's gitleaks_8.30.1_checksums.txt)
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" \
            --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --exit-code 1 .
