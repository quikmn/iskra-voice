# Weekly dependency updates. Minor and patch updates come as one PR per ecosystem and folder; majors one by one.
# New versions wait a week (cooldown) so a freshly published bad release has time to be caught.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/client, /desktop, /bots, /mobile]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The QR reader is updated by hand, both packages at once: barcode-detector pins the exact zxing-wasm its glue
    # loads, and the client ships that zxing-wasm's .wasm (client/package.json overrides keep them on one version).
    # zxing-wasm 3.1.5 on its own broke e2e/link.spec.ts; a barcode-detector bump alone would leave zxing-wasm behind.
    # src/ui/qrDetector.test.ts checks they match.
    ignore:
      - dependency-name: zxing-wasm
      - dependency-name: barcode-detector
    groups:
      # Every @capacitor/* package in one PR across /client and /mobile, majors too: the client and the phone shell
      # must run the same versions (client/src/platform/native.test.ts). Listed first, so the group below never
      # takes them; a new group name also starts a fresh PR that covers /mobile (the older group's PRs kept the
      # directories they started with, from before /mobile was added, and left the shell behind).
      capacitor:
        patterns: ['@capacitor/*']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
