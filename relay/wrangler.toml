# The Iskra push relay (README.md). Deployed by .github/workflows/deploy.yml (input `relay`).
# Secrets (wrangler secret put, or deploy.yml from the `release` environment): HANDLE_KEYS, APNS_KEY, APNS_KEY_ID,
# FCM_SERVICE_ACCOUNT. Never put them in this file.
name = "iskra-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "push.iskra.foo", custom_domain = true }]

[vars]
APNS_TEAM_ID = "BWX2M8XSNZ"
APNS_TOPIC = "foo.iskra.app"

# Abuse limits (Cloudflare's rate limiting binding: per location, approximate). period must be 10 or 60 seconds.
[[ratelimits]]
name = "REGISTER_LIMIT"   # registrations per IP
namespace_id = "41001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "SEND_IP_LIMIT"    # pushes per sending server (IP)
namespace_id = "41002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMIT"     # pushes per phone, from all servers together
namespace_id = "41003"
simple = { limit = 60, period = 60 }

[observability]
enabled = false
